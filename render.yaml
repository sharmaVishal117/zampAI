# Render blueprint — optional. The app also deploys fine by pointing a Web
# Service at this repo with the root-level Dockerfile. A Disk is what makes
# the run-history (data/runs.db) survive free-tier instance sleeps.
services:
  - type: web
    name: ap-invoice-processor
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    # Render sets PORT automatically for Docker services; no healthcheck path
    # needed since the server binds 0.0.0.0:$PORT on startup.
    autoDeploy: true
    # A single persistent disk, attached to this service. Render expects
    # `disk` (singular) as an object, NOT a `disks` list.
    disk:
      name: ap-data
      # Mount the app's data dir onto the persistent disk so runs.db and
      # uploaded PDFs survive rebuilds and free-tier sleeps.
      mountPath: /app/data