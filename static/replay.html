<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP Invoice Processor</title>
<style>
:root { color-scheme: light;
  --bg:#f6f7fb; --panel:#fff; --ink:#1c2333; --muted:#6b7486; --line:#e5e8f0;
  --pay:#0f8a5f; --pay-bg:#e4f5ee; --review:#b06e00; --review-bg:#fdf3e0;
  --reject:#c62b2b; --reject-bg:#fbe7e7; --hold:#5b5bd6; --hold-bg:#eceafd;
  --error:#c62b2b; --accent:#2456d6;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
header { background:var(--panel); border-bottom:1px solid var(--line); padding:14px 22px;
  display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:5;}
header h1 { font-size:16px; margin:0; letter-spacing:.2px; }
header .sub { color:var(--muted); font-size:12px; }
nav { margin-left:auto; display:flex; gap:6px; align-items:center;}
nav button { border:1px solid transparent; background:transparent; padding:7px 12px; border-radius:8px;
  cursor:pointer; font-size:13px; color:var(--ink); }
nav button.active { background:#eef1fa; border-color:#d8dff5; color:var(--accent); font-weight:600;}
.chip { font-size:11px; padding:3px 9px; border-radius:99px; background:#eef1f7; color:var(--muted); }
.chip.ok { background:var(--pay-bg); color:var(--pay); }
main { padding:22px; max-width:1200px; margin:0 auto; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
.grid { display:grid; gap:16px; }
.cols-4 { grid-template-columns:repeat(4,1fr); }
.cols-2 { grid-template-columns:1.1fr .9fr; }
@media (max-width:880px){ .cols-4{grid-template-columns:repeat(2,1fr)} .cols-2{grid-template-columns:1fr} }
.stat .n { font-size:26px; font-weight:700; }
.stat .l { color:var(--muted); font-size:12px; margin-top:2px;}
h2 { font-size:15px; margin:0 0 12px; }
h3 { font-size:13px; margin:14px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
  padding:8px 10px; border-bottom:1px solid var(--line);}
td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr.row { cursor:pointer; } tr.row:hover td { background:#f7f8fd; }
.badge { display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:99px; }
.badge.PAY { background:var(--pay-bg); color:var(--pay); }
.badge.REVIEW { background:var(--review-bg); color:var(--review); }
.badge.REJECT { background:var(--reject-bg); color:var(--reject); }
.badge.HOLD { background:var(--hold-bg); color:var(--hold); }
.badge.ERROR { background:var(--reject-bg); color:var(--reject); }
button.run { background:var(--accent); color:#fff; border:none; padding:10px 20px; border-radius:9px;
  font-size:14px; font-weight:600; cursor:pointer; }
button.run:disabled { opacity:.5; cursor:wait; }
select, input[type=file] { padding:8px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff;}
.pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);}
/* live run pipeline */
.pipe { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
.stage { flex:1; min-width:120px; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
  background:#fbfbfe; position:relative; transition:all .25s; }
.stage .num { font-size:11px; color:var(--muted); font-weight:700;}
.stage .name { font-size:12.5px; font-weight:600; margin-top:2px;}
.stage.active { border-color:var(--accent); background:#f0f4ff; box-shadow:0 0 0 3px rgba(36,86,214,.12); }
.stage.active .num { color:var(--accent);}
.stage.active .spin { display:inline-block; }
.stage.done { border-color:var(--pay); background:var(--pay-bg);}
.stage.done .num::before { content:"✓ "; color:var(--pay); font-weight:700;}
.stage.bad { border-color:var(--reject); background:var(--reject-bg);}
.spin { width:12px; height:12px; border:2px solid #c9d4f5; border-top-color:var(--accent); border-radius:50%;
  display:none; animation:rot .7s linear infinite; margin-left:6px; }
@keyframes rot { to{transform:rotate(360deg)} }
.log { background:#0f1424; color:#cfd8ea; font:11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  padding:12px 14px; border-radius:10px; max-height:230px; overflow-y:auto; white-space:pre-wrap; }
.log .s { color:#7fd1a8; } .log .w { color:#f2c14e; } .log .e { color:#ff8f8f; }
/* decision banner */
.decision { border-radius:12px; padding:16px 18px; font-size:14px; display:none; }
.decision.PAY { background:var(--pay-bg); color:var(--pay); display:block; border:1px solid #bfe3d2;}
.decision.REVIEW { background:var(--review-bg); color:var(--review); display:block; border:1px solid #f0d9a8;}
.decision.REJECT { background:var(--reject-bg); color:var(--reject); display:block; border:1px solid #f0bcbc;}
.decision.HOLD { background:var(--hold-bg); color:var(--hold); display:block; border:1px solid #c9c9f5;}
.decision .d { font-size:20px; font-weight:800; letter-spacing:.5px;}
.reasons li { margin:4px 0; }
.reasons { margin:8px 0 0; padding-left:18px; font-size:12.5px; }
table.issues td { font-size:12px; padding:6px 8px; }
code { font-family:ui-monospace, Menlo, monospace; font-size:12px; background:#f0f1f7; padding:1px 5px; border-radius:4px;}
.kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:12.5px; }
.kv .k { color:var(--muted); }
.drawer { position:fixed; top:0; right:-460px; width:440px; height:100vh; background:var(--panel);
  border-left:1px solid var(--line); box-shadow:-8px 0 30px rgba(20,30,60,.12); transition:right .3s; z-index:20; padding:20px; overflow-y:auto;}
.drawer.open { right:0; }
.hidden { display:none !important; }
.empty { color:var(--muted); font-size:13px; padding:20px; text-align:center; }
a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>AP Invoice Processor</h1>
  <span class="sub">PS-1 · invoice → reasoned decision</span>
  <nav>
    <button id="tab-run" class="active" onclick="show('run')">Process</button>
    <button id="tab-dash" onclick="show('dash')">Dashboard</button>
    <span class="chip" id="chip-llm">AI fallback: …</span>
    <button onclick="resetDb()" title="clear run history + processed-invoice register">Reset data</button>
  </nav>
</header>

<main>
<!-- ============================================================ PROCESS VIEW -->
<section id="view-run">
  <div class="panel">
    <h2>Run the pipeline</h2>
    <div class="grid" style="grid-template-columns:2fr 1fr; align-items:center">
      <div>
        <label style="font-size:12px; color:var(--muted)">Sample invoice</label>
        <select id="sample" style="width:100%; margin-top:4px"></select>
        <div id="sample-desc" class="pill" style="margin-top:6px"></div>
      </div>
      <div>
        <label style="font-size:12px; color:var(--muted)">…or upload a PDF</label>
        <input type="file" id="file" accept="application/pdf" style="width:100%; margin-top:4px">
      </div>
    </div>
    <div style="margin-top:14px; display:flex; gap:10px; align-items:center">
      <button class="run" id="btn-run" onclick="startRun()">▶ Run pipeline</button>
      <span class="pill" id="run-meta"></span>
    </div>
  </div>

  <div class="panel" style="margin-top:16px" id="pipe-panel">
    <h2>Live run view</h2>
    <div class="pipe" id="pipe"></div>
    <div class="decision" id="decision"></div>
    <h3>Audit trail</h3>
    <div class="log" id="log">— no run yet —</div>
  </div>
</section>

<!-- ============================================================ DASHBOARD VIEW -->
<section id="view-dash" class="hidden">
  <div class="grid cols-4" style="margin-bottom:16px">
    <div class="panel stat"><div class="n" id="st-total">–</div><div class="l">total runs</div></div>
    <div class="panel stat"><div class="n" style="color:var(--pay)" id="st-pay">–</div><div class="l">PAY</div></div>
    <div class="panel stat"><div class="n" style="color:var(--review)" id="st-review">–</div><div class="l">REVIEW</div></div>
    <div class="panel stat"><div class="n" style="color:var(--reject)" id="st-other">–</div><div class="l">REJECT / HOLD / ERR</div></div>
  </div>
  <div class="panel">
    <h2>Run history</h2>
    <table>
      <thead><tr><th>When</th><th>Invoice</th><th>Decision</th><th>PO</th><th>Amount</th><th>Match</th><th></th></tr></thead>
      <tbody id="runs-body"><tr><td colspan="7" class="empty">No runs yet — process an invoice first.</td></tr></tbody>
    </table>
  </div>
</section>
</main>

<!-- run detail drawer -->
<div class="drawer" id="drawer">
  <div style="display:flex; justify-content:space-between; align-items:center">
    <h2 style="margin:0">Run detail</h2>
    <button onclick="closeDrawer()" style="border:none;background:none;font-size:18px;cursor:pointer">✕</button>
  </div>
  <div id="drawer-body"></div>
</div>

<script>
const STAGES = ["Ingest & classify","Text extraction","Field extraction","Quality gate","PO matching","Rule validation","Decision & persist"];
const KEY2IDX = {ingest:0, extract:1, fields:2, quality:3, matching:4, validation:5, decision:6, error:6};

// ---------------------------------------------------------------- views
function show(v){
  document.getElementById('view-run').classList.toggle('hidden', v!=='run');
  document.getElementById('view-dash').classList.toggle('hidden', v!=='dash');
  document.getElementById('tab-run').classList.toggle('active', v==='run');
  document.getElementById('tab-dash').classList.toggle('active', v==='dash');
  if(v==='dash') refreshDash();
}

// ---------------------------------------------------------------- init
async function init(){
  const s = await j('/api/samples');
  const sel = document.getElementById('sample');
  sel.innerHTML = s.map(o=>`<option value="${o.path}">${o.file} — ${o.expect||o.description}</option>`).join('');
  sel.onchange = ()=>{
    const o = s.find(x=>x.path===sel.value);
    document.getElementById('sample-desc').textContent = o?o.description:'';
  };
  sel.onchange();
  buildPipe();
  const l = await j('/api/llm');
  const chip = document.getElementById('chip-llm');
  chip.textContent = l.configured ? 'AI fallback: ON' : 'AI fallback: rules+OCR only';
  chip.classList.toggle('ok', !!l.configured);
  refreshDash();
  // replay overrides come after

function buildPipe(){
  document.getElementById('pipe').innerHTML = STAGES.map((s,i)=>
    `<div class="stage" id="st-${i}"><div class="num">${i+1}<span class="spin"></span></div><div class="name">${s}</div></div>`).join('');
}
function setStage(i, cls){
  document.getElementById('st-'+i).className = 'stage '+cls;
}

// ---------------------------------------------------------------- run
async function startRun(){
  let target = null, label = null;
  if (document.getElementById('file').files.length){
    const f = document.getElementById('file').files[0];
    const fd = new FormData(); fd.append('file', f);
    const up = await (await fetch('/api/upload',{method:'POST', body:fd})).json();
    target = up.path; label = f.name;
  } else {
    target = document.getElementById('sample').value;
    label = target.split('/').pop();
  }
  document.getElementById('btn-run').disabled = true;
  document.getElementById('log').textContent = '';
  document.getElementById('decision').style.display = 'none';
  document.getElementById('decision').className = 'decision';
  STAGES.forEach((_,i)=>setStage(i,''));
  document.getElementById('run-meta').textContent = target;

  const r = await j('/api/run',{method:'POST', body:JSON.stringify({invoice_path:target, label})});
  if (r.error) return finishRunError('upload/run failed: '+r.error, r.run_id);
  const evtSource = new EventSource('/api/runs/'+r.run_id+'/live');
  evtSource.onmessage = (m)=>{
    const e = JSON.parse(m.data);
    logEvent(e);
    if (e.type==='decision'){
      showDecision(e.status, e.reasons, e.explanation, e.issues);
      if (e.matched_po) document.getElementById('run-meta').textContent =
        `${target}  ·  ${e.matched_po}  ·  run ${r.run_id}`;
    }
    if (e.type==='error'){ finishRunError(e.detail, r.run_id); }
  };
  evtSource.onerror = ()=>{
    // fall back to persisted record
    j('/api/runs/'+r.run_id).then(rec=>{
      (rec.events||[]).forEach(logEvent);
      const d = rec.decision;
      showDecision(d.status, d.reasons, d.explanation, d.issues);
      if (rec.error) finishRunError(rec.error, r.run_id);
      closeLive(r.run_id);
    }).catch(()=>finishRunError('could not load run record', r.run_id));
  };
  function closeLive(id){ evtSource.close(); document.getElementById('btn-run').disabled=false; }
  window._closeLive = closeLive;
  // close when we see closed sentinel via onmessage too:
  evtSource.addEventListener('message', ()=>{});
}

function logEvent(e){
  const log = document.getElementById('log');
  const idx = KEY2IDX[e.stage] ?? 6;
  // mark stages complete as we pass their start
  for (let i=0;i<idx;i++) setStage(i,'done');
  setStage(idx,'active');
  if (e.type==='stage-start'){ /* */ }
  if (e.type==='decision'){ STAGES.forEach((_,i)=>setStage(i, e.status==='PAY'?'done':'active'));
    if (e.status!=='PAY' && e.status!=='REVIEW') setStage(6, e.status==='REJECT'||e.status==='ERROR'?'bad':'active'); }
  let line = '';
  const t = ts();
  const cls = e.result==='degraded'||e.severity==='blocker' ? 'w' : '';
  if (e.type==='text-source') line = `[${e.stage}] text source: ${e.source} (${e.chars} chars, ${e.seconds}s, conf ${e.confidence})`;
  else if (e.type==='classify') line = `[${e.stage}] ${e.kind} invoice — ${e.detail}`;
  else if (e.type==='fields') line = `[${e.stage}] fields: ${e.fields.invoice_number||'∅'} · vendor ${e.fields.vendor_name||'∅'} · ${e.fields.po_refs.length} PO ref · total ${fmtMoney(e.fields.total_printed)}`;
  else if (e.type==='gate') line = `[${e.stage}] ${e.result==='pass'?'quality gate: PASS':'quality gate: DEGRADED — missing '+ (e.missing||[]).join(', ')}`;
  else if (e.type==='ocr-confidence') line = `[${e.stage}] ${e.detail}`;
  else if (e.type==='total-mismatch') line = `[${e.stage}] ${e.detail}`;
  else if (e.type==='match') line = `[${e.stage}] ${e.matched_po?('matched '+e.matched_po+' ('+e.match_type+')'):'no PO matched'} — ${e.note}`;
  else if (e.type==='rules') line = `[${e.stage}] rules: tol ±${e.rules.amount_tolerance_pct}% / ±$${e.rules.absolute_tolerance}, split ${e.rules.split_billing_pct}% · duplicates ${e.duplicates.length}, split-billing ${e.split_billing}`;
  else if (e.type==='decision') line = `[${e.stage}] DECISION: ${e.status} (${e.elapsed_s}s)`;
  else if (e.type==='error') line = `[error] ${e.detail}`;
  else if (e.type==='stage-start') line = `[${e.stage}] starting — ${e.detail} (${e.size_kb} KB, ${e.pages} p)`;
  else if (e.detail) line = `[${e.stage}] ${e.detail}`;
  log.innerHTML += `<span class="${cls}">${line}\n</span>`;
  log.scrollTop = log.scrollHeight;
}

function showDecision(status, reasons, explanation, issues){
  const d = document.getElementById('decision');
  d.className = 'decision ' + status;
  let html = `<div class="d">${status}</div>`;
  if (explanation) html += `<div style="margin-top:4px">${explanation}</div>`;
  if (reasons && reasons.length){
    html += `<ul class="reasons">${reasons.map(r=>`<li>${r}</li>`).join('')}</ul>`;
  }
  if (issues && issues.length){
    html += `<h3 style="margin:10px 0 4px">Flagged issues</h3><table class="issues"><tr><th>code</th><th>severity</th><th>why</th></tr>` +
      issues.map(i=>`<tr><td><code>${i.code}</code></td><td>${i.severity}</td><td>${i.message}</td></tr>`).join('') + '</table>';
  }
  d.innerHTML = html;
  refreshDash();
}
function finishRunError(msg, run_id){
  document.getElementById('log').innerHTML += `<span class="e">${msg}\n</span>`;
  if (window._closeLive) window._closeLive(run_id);
}

// ---------------------------------------------------------------- dashboard
async function refreshDash(){ /* no-op in replay; refreshDashFromRecorded populates it */ }
  const counts = {PAY:0, REVIEW:0, OTHER:0};
  runs.forEach(r=>{
    if (r.decision==='PAY') counts.PAY++;
    else if (r.decision==='REVIEW') counts.REVIEW++;
    else counts.OTHER++;
  });
  document.getElementById('st-total').textContent = runs.length;
  document.getElementById('st-pay').textContent = counts.PAY;
  document.getElementById('st-review').textContent = counts.REVIEW;
  document.getElementById('st-other').textContent = counts.OTHER;
  const tb = document.getElementById('runs-body');
  if (!runs.length){ tb.innerHTML = '<tr><td colspan="7" class="empty">No runs yet.</td></tr>'; return; }
  tb.innerHTML = runs.map(r=>
    `<tr class="row" onclick="openRun('${r.id}')">
      <td>${new Date(r.created_at*1000).toLocaleString()}</td>
      <td>${r.filename}</td>
      <td><span class="badge ${r.decision}">${r.decision}</span></td>
      <td>${r.matched_po||'—'}</td>
      <td>${r.amount!=null?'$'+Number(r.amount).toLocaleString(undefined,{minimumFractionDigits:2}):'—'}</td>
      <td>${r.match_type||'—'}</td>
      <td>↗</td></tr>`).join('');
}

async function openRun(id){
  const r = await j('/api/runs/'+id);
  const d = r.decision || {};
  let html = `
    <div class="decision ${d.status}" style="display:block"><div class="d">${d.status||'ERROR'}</div>
      ${d.explanation?`<div>${d.explanation}</div>`:''}</div>
    <h3>Stages</h3>
    <div class="kv">` + STAGES.map((s,i)=>`<span class="k">stage ${i+1}</span><span>${s}</span>`).join('') + `</div>
    <h3>PO candidates scored</h3>`;
  const cands = (d.po_candidates||[]).map(c=>({
    po_id: c.po_id || (c.po && c.po.po_id) || '—',
    vendor: c.vendor || (c.po && c.po.vendor_name) || '—',
    score: c.score, diff_pct: c.diff_pct
  }));
  if (cands.length){
    html += `<table><tr><th>PO</th><th>vendor</th><th>score</th><th>diff</th></tr>` +
      cands.map(c=>`<tr><td>${c.po_id}</td><td>${c.vendor}</td><td>${c.score}</td><td>${c.diff_pct!=null?c.diff_pct.toFixed(1)+'%':'—'}</td></tr>`).join('') + '</table>';
  } else html += '<div class="empty">no candidates</div>';
  html += `<h3>Extracted fields</h3><div class="kv">`;
  const e = d.extracted||{};
  html += `<span class="k">invoice</span><span>${e.invoice_number||'—'}</span>
    <span class="k">vendor</span><span>${e.vendor_name||'—'}</span>
    <span class="k">date</span><span>${e.invoice_date||'—'}</span>
    <span class="k">PO refs</span><span>${(e.po_refs||[]).join(', ')||'—'}</span>
    <span class="k">total</span><span>${fmtMoney(d.amount_to_pay)}</span>
    <span class="k">line items</span><span>${(e.line_items||[]).length}</span>`;
  html += `</div><h3>Reasons</h3><ul class="reasons">${(d.reasons||[]).map(x=>`<li>${x}</li>`).join('')||'<li>—</li>'}</ul>`;
  html += `<h3>Raw events (${(r.events||[]).length})</h3><div class="log" style="max-height:200px">${(r.events||[]).map(ev=>{
      const c = ev.result==='degraded'?'w':'';
      return `<span class="${c}">[${ev.stage}] ${JSON.stringify(Object.fromEntries(Object.entries(ev).filter(([k])=>k!=='stage'))).slice(0,160)}</span>`;
  }).join('\n')}</div>`;
  document.getElementById('drawer-body').innerHTML = html;
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); }

// ---------------------------------------------------------------- utils
function j(path, opts){ return Promise.resolve().then(()=>{throw new Error('replay mode: use recorded data');});}
function fmtMoney(v){ return v==null?'—':'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:2}); }
function ts(){ return new Date().toLocaleTimeString(); }

  await refreshDashFromRecorded();
  document.getElementById('sample').innerHTML = RUNS.map((r,i)=>
    `<option value="${i}">${r.file} — ${r.expected||''}</option>`).join('');
  document.getElementById('sample').onchange = ()=>{
    const r = RUNS[+document.getElementById('sample').value];
    document.getElementById('sample-desc').textContent = r.description;
  };
  document.getElementById('sample-desc').textContent = RUNS[0].description;
  document.getElementById('chip-llm').textContent = 'AI fallback: rules+OCR only';
  // replace Run button behaviour with replay
  window.startRun = async function(){
    await replayRun(+document.getElementById('sample').value);
  };
  buildPipe();
  document.getElementById('btn-run').textContent = '▶ Replay run';
}

async function refreshDashFromRecorded(){
  document.getElementById('st-total').textContent = RUNS.length;
  const c = {PAY:0,REVIEW:0,OTHER:0};
  RUNS.forEach(r=>{ if(r.decision.status==='PAY')c.PAY++; else if(r.decision.status==='REVIEW')c.REVIEW++; else c.OTHER++; });
  document.getElementById('st-pay').textContent = c.PAY;
  document.getElementById('st-review').textContent = c.REVIEW;
  document.getElementById('st-other').textContent = c.OTHER;
  const tb = document.getElementById('runs-body');
  tb.innerHTML = RUNS.map((r,i)=>
    `<tr class="row" onclick="replayRun(${i})">
      <td>${r.file}</td><td><span class="badge ${r.decision.status}">${r.decision.status}</span></td>
      <td>${r.decision.matched_po?r.decision.matched_po.po_id:'—'}</td>
      <td>${r.decision.amount_to_pay!=null?'$'+Number(r.decision.amount_to_pay).toLocaleString(undefined,{minimumFractionDigits:2}):'—'}</td>
      <td>${r.decision.match_type||'—'}</td><td>↗</td></tr>`).join('');
  // keep drawer working off recorded data
  window.openRun = function(idx){
    const r = RUNS[idx]; const d = r.decision;
    document.getElementById('drawer-body').innerHTML = drawerHtml(d, r.events);
    document.getElementById('drawer').classList.add('open');
  };
  // point dashboard rows at replayRun already; keep closeDrawer
}

function drawerHtml(d, events){
  let html = `<div class="decision ${d.status}" style="display:block"><div class="d">${d.status}</div>
    ${d.explanation?`<div>${d.explanation}</div>`:''}</div>
    <h3>PO candidates scored</h3>`;
  const cands = (d.po_candidates||[]).map(c=>({po_id:c.po&&c.po.po_id, vendor:c.po&&c.po.vendor_name, score:c.score, diff_pct:c.diff_pct}));
  if (cands.length){
    html += `<table><tr><th>PO</th><th>vendor</th><th>score</th><th>diff</th></tr>` +
      cands.map(c=>`<tr><td>${c.po_id}</td><td>${c.vendor}</td><td>${c.score}</td><td>${c.diff_pct!=null?c.diff_pct.toFixed(1)+'%':'—'}</td></tr>`).join('') + '</table>';
  } else html += '<div class="empty">no candidates</div>';
  html += `<h3>Extracted fields</h3><div class="kv">`;
  const e = d.extracted||{};
  html += `<span class="k">invoice</span><span>${e.invoice_number||'—'}</span>
    <span class="k">vendor</span><span>${e.vendor_name||'—'}</span>
    <span class="k">date</span><span>${e.invoice_date||'—'}</span>
    <span class="k">PO refs</span><span>${(e.po_refs||[]).join(', ')||'—'}</span>
    <span class="k">total</span><span>${e.total_printed!=null?'$'+Number(e.total_printed).toLocaleString(undefined,{minimumFractionDigits:2}):'—'}</span>
    <span class="k">line items</span><span>${(e.line_items||[]).length}</span>
    <span class="k">source</span><span>${e.text_source||'—'} (conf ${e.confidence??'—'})</span>`;
  html += `</div><h3>Reasons</h3><ul class="reasons">${(d.reasons||[]).map(x=>`<li>${x}</li>`).join('')||'<li>—</li>'}</ul>
    <h3>Audit trail (${events.length} events)</h3><div class="log" style="max-height:200px">${events.map(ev=>
      `<span class="${ev.result==='degraded'?'w':''}">[${ev.stage}] ${ev.type}: ${JSON.stringify(Object.fromEntries(Object.entries(ev).filter(([k])=>!['stage','type','name'].includes(k)))).slice(0,140)}</span>`
    ).join('\n')}</div>`;
  return html;
}

const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function replayRun(idx){
  const r = RUNS[idx];
  cur = idx;
  document.getElementById('log').textContent = '';
  document.getElementById('decision').style.display='none';
  document.getElementById('decision').className='decision';
  STAGES.forEach((_,i)=>setStage(i,''));
  buildPipe();
  document.getElementById('btn-run').disabled = true;
  document.getElementById('run-meta').textContent = r.file;
  for (const ev of r.events){
    logEvent(ev);
    if (ev.type==='decision'){ showDecision(ev.status, ev.reasons, ev.explanation, ev.issues); }
    await sleep(ev.type==='decision'?400:260);
  }
  document.getElementById('btn-run').disabled = false;
  // expose drawer for this run
  window.openRun = (i)=>{ drawerOpen(RUNS[i]); };
}
function drawerOpen(r){
  document.getElementById('drawer-body').innerHTML = drawerHtml(r.decision, r.events);
  document.getElementById('drawer').classList.add('open');
}

// dashboard "open detail" -> drawer from recorded data
const _origShow = show;
show = function(v){ _origShow(v); };
replayInit();

</script>
</body>
</html>
